<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>QuickList</title>
</head>
<body>
    <header>
        <img src="./img/logo.png" alt="Logo do Site">
    </header>

    <main>
        <section class="adicionar-item">
            <h1>Compras da Semana</h1>
            <div>
                <input type="text" placeholder="Adicionar um item" id="novo-item">
                <button>Adicionar Item</button>
            </div>
        </section>
        <section class="items">
         <div class="item">
            <div>
                <input type="checkbox" id="item-1">
                <label for="item-1">Pão de Forma</label>
            </div>
            <button>
                <img src="./img/trash-icon.svg" alt="lixo">
            </button>
         </div>
         <div class="item">
            <div>
                <input type="checkbox" id="item-1">
                <label for="item-1">Café Preto</label>
            </div>
            <button>
                <img src="./img/trash-icon.svg" alt="lixo">
            </button>
         </div>
         <div class="item">
            <div>
                <input type="checkbox" id="item-1">
                <label for="item-1">Suco de Laranja</label>
            </div>
            <button>
                <img src="./img/trash-icon.svg" alt="lixo">
            </button>
         </div>
        </section>
    </main>
</body>
</html>
