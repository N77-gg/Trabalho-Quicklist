<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicklist</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="./img/logo.png" alt="Logo">
    </header>

    <main>
        <section class="adicionar-item">
            <h1>Compras da semana</h1>
            <div>
                <input type="text" placeholder="Adicionar um item" id="nova-lista">
                <button>Adicionar item</button>
            </div>
        </section>
        
        <section class="itens">
            <div class="item">
                <div>
                    <input type="checkbox" id="item-1">
                    <div class="checkbox-customizada">
                       <img src="img/checked.svg" alt="checked">
                    </div>
                    <label for="item-1">Pao de forma</label>
                </div>

                <button>
                    <img src="./img/trash-icon.svg" alt="logo da Lixeira">
                </button>
            </div>
        </section>
    </main>
</body>
</html>
